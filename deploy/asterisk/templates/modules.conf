[modules]
autoload = no

; This is the complete, explicit dependency closure for one IP-identified
; PJSIP/PCMU inbound call, the bounded dialplan, ARI control/events and JSON
; chan_websocket media. Asterisk exits startup rather than silently loading a
; broader module set or degrading the contract.
require = app_stasis.so
; ARI channels/{id}/dial places every not-yet-answered outbound channel in
; Asterisk's invisible singleton holding bridge before calling its endpoint.
require = bridge_holding.so
require = bridge_simple.so
require = chan_pjsip.so
require = chan_websocket.so
require = codec_ulaw.so
require = func_groupcount.so
require = func_timeout.so
require = pbx_config.so
require = res_ari.so
require = res_ari_asterisk.so
require = res_ari_bridges.so
require = res_ari_channels.so
require = res_ari_events.so
require = res_ari_model.so
require = res_http_websocket.so
require = res_pjproject.so
require = res_pjsip.so
require = res_pjsip_caller_id.so
require = res_pjsip_endpoint_identifier_ip.so
require = res_pjsip_nat.so
require = res_pjsip_pubsub.so
require = res_pjsip_sdp_rtp.so
require = res_pjsip_session.so
require = res_rtp_asterisk.so
require = res_sorcery_astdb.so
require = res_sorcery_config.so
require = res_sorcery_memory.so
require = res_stasis.so
require = res_stasis_answer.so
require = res_stasis_playback.so
require = res_stasis_recording.so
require = res_stasis_snoop.so
require = res_timing_timerfd.so
require = res_websocket_client.so
