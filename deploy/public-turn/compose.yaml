name: dji4g-public-turn

services:
  coturn:
    image: "${DJI4G_COTURN_IMAGE:?missing pinned coturn image name@sha256}"
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "${DJI4G_TURN_UID:?missing runtime uid}:${DJI4G_TURN_GID:?missing runtime gid}"
    command:
      - -c
      - /etc/coturn/turnserver.conf
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/172.30.247.2/3478
      interval: 5s
      timeout: 2s
      start_period: 3s
      retries: 6
    ports:
      - name: turn-udp
        target: 3478
        published: "3478"
        host_ip: 0.0.0.0
        protocol: udp
      - name: turn-tcp
        target: 3478
        published: "3478"
        host_ip: 0.0.0.0
        protocol: tcp
      - name: turns-tcp
        target: 5349
        published: "443"
        host_ip: 0.0.0.0
        protocol: tcp
      - name: relay-49160-udp
        target: 49160
        published: "49160"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49161-udp
        target: 49161
        published: "49161"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49162-udp
        target: 49162
        published: "49162"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49163-udp
        target: 49163
        published: "49163"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49164-udp
        target: 49164
        published: "49164"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49165-udp
        target: 49165
        published: "49165"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49166-udp
        target: 49166
        published: "49166"
        host_ip: 0.0.0.0
        protocol: udp
      - name: relay-49167-udp
        target: 49167
        published: "49167"
        host_ip: 0.0.0.0
        protocol: udp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - type: bind
        source: "${DJI4G_PUBLIC_TURN_ROOT:?missing runtime root}/config/turnserver.conf"
        target: /etc/coturn/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DJI4G_PUBLIC_TURN_ROOT:?missing runtime root}/secrets/turn-tls-cert.pem"
        target: /run/secrets/turn-tls-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DJI4G_PUBLIC_TURN_ROOT:?missing runtime root}/secrets/turn-tls-key.pem"
        target: /run/secrets/turn-tls-key.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      public-turn:
        ipv4_address: 172.30.247.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  public-turn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.247.0/28
          gateway: 172.30.247.1
